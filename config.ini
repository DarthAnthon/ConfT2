package_name = org.springframework.boot:spring-boot:2.4.0

# URL-адрес репозитория или путь к файлу тестового репозитория
repository_url = https://repo1.maven.org/maven2

# Режим работы с тестовым репозиторием (true/false)
test_mode = false

# Имя сгенерированного файла с изображением графа
output_filename = dependency_graph.png

# Подстрока для фильтрации пакетов (опционально)
filter_substring = 
